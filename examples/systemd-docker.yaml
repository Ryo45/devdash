workloads:
  robot_container:
    name: Robot container
    backend: systemd
    scope: system
    unit: robot-container.service
    observer:
      docker:
        compose:
          project: robot
          service: robot
        socket: /var/run/docker.sock
    controller:
      kind: supervisord
      socket: /run/supervisor.sock
      python: python3
stages:
- id: robot
  name: robot
  description: Migrated robot, Step 1; review Stage boundary
  checks:
  - 'Before starting the next Stage: operator_continue'
  workloads:
  - robot_container
dependencies: {}
