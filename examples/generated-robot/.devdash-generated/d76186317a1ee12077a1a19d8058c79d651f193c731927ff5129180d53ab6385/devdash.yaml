dependencies:
  detector:
  - camera
  - imu
  planner:
  - detector
plan_templates:
  first_start:
    kind: startup
    name: Initial staged startup
  recover_current:
    kind: start_missing
    name: Start missing Workloads from current state
  restart_perception:
    from_stage: perception
    kind: restart_from
    name: Restart Perception and Control
  stop_robot:
    from_stage: sensors
    kind: stop_from
stages:
- checks:
  - Verify images and IMU before explicitly starting Perception
  description: Check camera images and IMU data
  id: sensors
  name: Sensors
  workloads:
  - camera
  - imu
- checks:
  - Verify perception output before starting Control
  description: ''
  id: perception
  name: Perception
  workloads:
  - detector
- checks: []
  description: ''
  id: control
  name: Control
  workloads:
  - planner
workloads:
  camera:
    backend: systemd
    name: ''
    scope: user
    unit: devdash-demo-camera.service
  detector:
    backend: systemd
    name: ''
    scope: user
    unit: devdash-demo-detector.service
  imu:
    backend: systemd
    name: ''
    scope: user
    unit: devdash-demo-imu.service
  planner:
    backend: systemd
    name: ''
    scope: user
    unit: devdash-demo-planner.service
