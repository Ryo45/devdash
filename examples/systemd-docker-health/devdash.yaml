# The existing unit owns mandatory readiness; devdash only waits for its job result.
workloads:
  container:
    backend: systemd
    scope: user # Use system if installing the unit in the system manager.
    unit: robot-container.service
    observer:
      docker: {container: robot-dev}
    controller:
      kind: supervisord
      socket: /tmp/devdash-supervisor.sock
  next:
    backend: systemd
    scope: user
    unit: robot-next.service

groups:
  robot:
    steps:
      - workload: container
      - gate: operator
      - workload: next

gates:
  operator: {type: manual}
