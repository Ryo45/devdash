workloads:
  container:
    backend: systemd
    scope: user
    unit: robot-container.service
    observer:
      docker:
        container: robot-dev
        socket: /var/run/docker.sock
    controller:
      kind: supervisord
      socket: /tmp/devdash-supervisor.sock
      python: python3
    name: ''
  next:
    backend: systemd
    scope: user
    unit: robot-next.service
    name: ''
stages:
- id: container
  workloads:
  - container
  checks:
  - Inspect process/health before explicitly starting next
  name: container
  description: ''
- id: next
  workloads:
  - next
  name: next
  description: ''
  checks: []
dependencies:
  next:
  - container
