[package]
name = "devdash"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
default-run = "devdash"

[features]
default = []
gui = ["dep:gpui-kit"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }
gpui-kit = { version = "=0.8.1", optional = true, default-features = false, features = ["component", "assets"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "devdash-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
