[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devdash-python"
version = "0.4.0.dev0"
description = "Linux workload dashboard with a headless asyncio Core and Tkinter GUI"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
readme = "README.md"
dependencies = ["aiohttp>=3.13,<4", "dbus-fast==5.0.22", "PyYAML==6.0.3"]

[project.optional-dependencies]
gui = ["ttkbootstrap==2.2.7"]

[project.scripts]
devdash = "devdash.cli:main"
devdash-gui = "devdash.gui:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]

[tool.setuptools.package-data]
devdash = ["templates/*"]

[tool.setuptools.packages.find]
include = ["devdash*"]
namespaces = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests/python"]
markers = ["integration: dedicated real systemd/Docker fixtures", "gui: Tkinter GUI integration"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
