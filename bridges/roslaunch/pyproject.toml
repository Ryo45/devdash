[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devdash-roslaunch"
version = "0.1.0"
requires-python = ">=3.10"
description = "Capability-limited ROS 2 LaunchService bridge; no process supervisor"
license = {text = "MIT OR Apache-2.0"}

[project.scripts]
devdash-roslaunch = "devdash_roslaunch.bridge:main"

[tool.setuptools.packages.find]
where = ["."]
namespaces = false
